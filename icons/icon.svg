<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hf_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF8F5"/>
    </linearGradient>
    <linearGradient id="hf_steam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF5E36"/>
      <stop offset="100%" stop-color="#FF2A6D"/>
    </linearGradient>
    <linearGradient id="hf_food" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA826"/>
      <stop offset="100%" stop-color="#FF4B2B"/>
    </linearGradient>
    <linearGradient id="hf_bowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Squircle Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#hf_bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#FFE4DB" stroke-width="2"/>

  <!-- Logo Group -->
  <g transform="translate(0, 10)">
    <!-- Steam Ribbons Forming Abstract H -->
    <!-- Left Steam -->
    <path d="M182 255 C 150 195, 145 120, 188 45 C 202 52, 196 72, 196 72 C 170 130, 172 195, 205 255 Z" fill="url(#hf_steam)"/>
    <!-- Right Steam -->
    <path d="M325 255 C 355 195, 360 130, 318 65 C 304 72, 312 90, 312 90 C 336 135, 332 195, 302 255 Z" fill="url(#hf_steam)"/>
    <!-- Diagonal Vapor Drift -->
    <path d="M172 172 C 220 142, 280 135, 332 148 L 324 168 C 275 155, 220 162, 170 192 Z" fill="url(#hf_steam)"/>

    <!-- Aromatic Food Mound -->
    <path d="M106 275 C 155 190, 355 190, 406 275 Z" fill="url(#hf_food)"/>
    <ellipse cx="256" cy="234" rx="42" ry="12" fill="#FFF5C3" opacity="0.85"/>
    <ellipse cx="269" cy="194" rx="13" ry="8" fill="#10B981"/>

    <!-- Modern Ceramic Vessel / Bowl -->
    <polygon points="88,275 424,275 400,360 366,405 330,416 182,416 146,405 112,360" fill="url(#hf_bowl)"/>
    <!-- Bowl Rim Accent Line -->
    <line x1="96" y1="277" x2="416" y2="277" stroke="#FF5E36" stroke-width="6" stroke-linecap="round"/>
    <!-- Bowl Bottom Foot Line -->
    <line x1="190" y1="416" x2="322" y2="416" stroke="#FF5E36" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <!-- Shadow -->
    <ellipse cx="256" cy="431" rx="96" ry="7" fill="#0F172A" opacity="0.12"/>
  </g>
</svg>