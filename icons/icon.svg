<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="hf_canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2220"/>
      <stop offset="60%" stop-color="#141817"/>
      <stop offset="100%" stop-color="#121414"/>
    </linearGradient>

    <!-- Electric Mint Steam Gradient -->
    <linearGradient id="hf_steam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#4EFEB3"/>
    </linearGradient>

    <!-- Off-White Food Mound Gradient -->
    <linearGradient id="hf_food" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F4FFF9"/>
      <stop offset="100%" stop-color="#B8C4BF"/>
    </linearGradient>

    <!-- Elevated Carbon Vessel Gradient -->
    <linearGradient id="hf_bowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252C29"/>
      <stop offset="100%" stop-color="#1A201E"/>
    </linearGradient>

    <!-- Mint Radial Glow Filter -->
    <filter id="mint_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Carbon Black Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#hf_canvas)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#35413B" stroke-width="3"/>
  <rect width="496" height="496" x="8" y="8" rx="108" fill="none" stroke="#00F5A0" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Logo Group shifted slightly up for optimal balance -->
  <g transform="translate(0, -6)">
    <!-- Steam Ribbons Forming Abstract 'H' in Electric Mint -->
    <!-- Left Steam Column -->
    <path d="M182 240 C 150 180, 145 105, 188 35 C 202 42, 196 60, 196 60 C 170 115, 172 180, 205 240 Z" fill="url(#hf_steam)" filter="url(#mint_glow)"/>
    <!-- Right Steam Column -->
    <path d="M325 240 C 355 180, 360 115, 318 55 C 304 62, 312 78, 312 78 C 336 120, 332 180, 302 240 Z" fill="url(#hf_steam)" filter="url(#mint_glow)"/>
    <!-- Diagonal Vapor Drift Forming 'H' Crossbar -->
    <path d="M172 160 C 220 130, 280 123, 332 136 L 324 155 C 275 142, 220 149, 170 179 Z" fill="url(#hf_steam)" opacity="0.95"/>

    <!-- Aromatic Food Mound in Off-White -->
    <path d="M110 260 C 155 180, 355 180, 402 260 Z" fill="url(#hf_food)"/>
    <ellipse cx="256" cy="221" rx="38" ry="10" fill="#FFFFFF" opacity="0.95"/>
    <!-- Fresh Mint Garnish Leaf -->
    <ellipse cx="268" cy="183" rx="12" ry="7" fill="#00F5A0"/>

    <!-- Modern Ceramic Vessel / Bowl in Elevated Carbon -->
    <polygon points="96,260 416,260 392,340 360,380 326,390 186,390 152,380 120,340" fill="url(#hf_bowl)" stroke="#35413B" stroke-width="2"/>
    <!-- Bowl Rim Accent Line in Electric Mint -->
    <line x1="104" y1="262" x2="408" y2="262" stroke="#00F5A0" stroke-width="6" stroke-linecap="round"/>
    <!-- Bowl Foot Accent Line -->
    <line x1="194" y1="390" x2="318" y2="390" stroke="#00F5A0" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

    <!-- Subtle Ground Shadow -->
    <ellipse cx="256" cy="404" rx="90" ry="6" fill="#000000" opacity="0.45"/>

    <!-- HAVFOOD Brand Text: 'HAV' in Electric Mint, 'FOOD' in Off-White -->
    <text x="256" y="466" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="62" letter-spacing="3">
      <tspan fill="#00F5A0">HAV</tspan><tspan fill="#F4FFF9">FOOD</tspan>
    </text>
  </g>
</svg>
